<!DOCTYPE html>
<html lang="en" class="bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Full route view for the assigned bus." />
    <title>Route — Conductor Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="min-h-dvh bg-slate-100 text-slate-900">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-2xl items-center justify-between px-4 py-3">
        <a
          href="./dashboard.html"
          class="flex h-9 items-center gap-1 rounded-lg px-2 text-sm font-semibold text-indigo-600 transition hover:bg-indigo-50"
          aria-label="Back to dashboard"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Dashboard
        </a>
        <p class="text-sm font-bold text-slate-900">Full Route</p>
        <span class="w-24"></span>
      </div>
    </header>

    <main class="mx-auto max-w-2xl px-4 py-5">
      <!-- Bus summary -->
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h1 id="r-bus-title" class="text-2xl font-extrabold tracking-tight">BUS</h1>
            <p id="r-bus-reg" class="mt-1 text-sm text-slate-500">&nbsp;</p>
          </div>
          <span id="r-trip-pill" class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm font-bold">
            <span id="r-trip-dot" class="h-2 w-2 rounded-full"></span>
            <span id="r-trip-text">&mdash;</span>
          </span>
        </div>

        <dl class="mt-5 grid grid-cols-2 gap-x-4 gap-y-4 border-t border-slate-100 pt-4 sm:grid-cols-3">
          <div>
            <dt class="text-xs font-medium text-slate-400">Timing</dt>
            <dd id="r-timing" class="mt-0.5 text-base font-bold text-slate-900">&mdash;</dd>
          </div>
          <div>
            <dt class="text-xs font-medium text-slate-400">Parking Zone</dt>
            <dd id="r-zone" class="mt-0.5 text-base font-bold text-slate-900">&mdash;</dd>
          </div>
          <div>
            <dt class="text-xs font-medium text-slate-400">Seats</dt>
            <dd id="r-seats" class="mt-0.5 text-base font-bold text-slate-900">&mdash;</dd>
          </div>
          <div>
            <dt class="text-xs font-medium text-slate-400">Current Stop</dt>
            <dd id="r-current" class="mt-0.5 text-base font-bold text-indigo-600">&mdash;</dd>
          </div>
          <div>
            <dt class="text-xs font-medium text-slate-400">Conductor</dt>
            <dd id="r-conductor" class="mt-0.5 text-base font-bold text-slate-900">&mdash;</dd>
          </div>
          <div>
            <dt class="text-xs font-medium text-slate-400">Phone</dt>
            <dd id="r-phone" class="mt-0.5 text-base font-bold text-slate-900">&mdash;</dd>
          </div>
        </dl>
      </section>

      <!-- Full timeline -->
      <section class="mt-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400">
            Complete Route
          </h2>
          <span id="r-progress" class="text-xs font-semibold text-slate-500">&mdash;</span>
        </div>
        <ol id="r-timeline" class="mt-5"></ol>
      </section>

      <!-- Back action -->
      <section class="mt-6 mb-4">
        <a
          href="./dashboard.html"
          class="flex min-h-13 w-full items-center justify-center gap-2 rounded-2xl bg-indigo-600 px-6 py-3 text-base font-bold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-700 active:scale-[0.99]"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Back to Dashboard
        </a>
      </section>
    </main>

    <!-- Scripts: data -> api -> common -> page -->
    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/route.js"></script>
  </body>
</html>
